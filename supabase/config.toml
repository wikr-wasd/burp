# Supabase CLI-konfiguration för lokal utveckling.
# `supabase start` startar hela stacken i Docker mot dessa portar.

project_id = "burp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Båda filerna, i den här ordningen. seed-staff.sql skapar personalkontona i
# auth.users och kördes förut för hand — vilket betydde att varje `db reset`
# tyst tog bort inloggningarna och fjorton kontroller i smoke.sh föll utan att
# något var fel på produkten. En lokal miljö ska vara komplett efter en reset.
#
# Filerna körs aldrig mot ett fjärrprojekt; `db push` skjuter bara migrationer.
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-staff.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
# Fångar utgående mail lokalt så att inget testmail når en riktig gäst.
# Hette [inbucket] före Supabase CLI 2.x.
enabled = true
port = 54324

[storage]
enabled = true
# Menybilder. Videon ligger inte här utan hos en videotjänst (avsnitt 8.2).
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false  # Endast lokalt. I prod ska bekräftelse krävas.

[auth.sms]
enable_signup = false

# ── Tvåstegsverifiering ──────────────────────────────────────────────────────
#
# MÅSTE stå här. Supabase Auth har TOTP AVSTÄNGT som standard, och utan de här
# raderna svarar /auth/v1/factors:
#
#   {"code":422,"error_code":"mfa_totp_enroll_not_enabled",
#    "msg":"MFA enroll is disabled for TOTP"}
#
# Hela funktionen var därmed död från migration 0051 (2026-08-22) till
# 2026-09-01: schemat, RLS-grinden, gränssnittet och återställningen i
# backoffice fanns och fungerade var för sig — men ingen kunde registrera en
# faktor, alltså slog `mfa_satisfied()` aldrig till för någon.
#
# Att det inte syntes berodde på att röktestet prövade DATABASGRINDEN genom att
# skriva en rad direkt i `auth.mfa_factors`. Den vägen finns inte för en
# människa. `smoke.sh` registrerar numera en riktig faktor över API:t.
#
# ⚠️ Den här filen gäller BARA den lokala stacken. I molnet slås samma sak på
# under Authentication → Multi-Factor Authentication i Supabase-dashboarden.
# Se docs/DEPLOYMENT.md.

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
